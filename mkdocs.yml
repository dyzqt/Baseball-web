site_name: 棒球知识库
site_description: 介绍棒球基础知识和训练方法的网站
site_author: dyzqt
use_directory_urls: true

theme:
  name: material
  language: zh
  logo: assets/images/队标.png
  favicon: assets/images/队标.png
  palette:
    primary: blue
    accent: light-blue
  features:
    - search.suggest
    - search.highlight

hooks:
  - hooks/gallery.py

watch:
  - hooks/gallery.py

plugins:
  - search:
      lang:
        - zh

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
  - tables

extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css
  - assets/stylesheets/quiz.css

extra_javascript:
  - assets/javascripts/gallery.js
  - assets/javascripts/quiz.js

exclude_docs: |
  guide/*
  notes/example.md

nav:
  - 首页: index.md
  - 讲解:
      - 棒球规则（简）: notes/rules.md
      - 棒球专业名词: notes/专有名词.md
      - 裁判手势: notes/裁判手势.md
      - 棒球规则（详）: notes/详细规则.md
  - 训练:
      - 传接球训练: writing/传接球.md
      - 打击训练: writing/打击.md
  - 练习:
      - 局面判断: quiz/index.md
  - 时刻: gallery/index.md
  - 其他: other/index.md