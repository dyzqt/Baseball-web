site_name: 棒球入门训练
site_description: 介绍棒球基础知识和训练方法的静态网站
site_author: Baseball Training
use_directory_urls: true

theme:
  name: material
  language: zh
  palette:
    primary: red
    accent: red

plugins: []

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables

extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css

exclude_docs: |
  guide/*
  notes/*
  writing/*

nav:
  - 首页: index.md
  - 第一篇：棒球入门训练: baseball-training.md
