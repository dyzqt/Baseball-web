<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" role="img" aria-labelledby="title desc">
  <title>跑垒顺序示意图</title>
  <desc>显示本垒、一垒、二垒、三垒以及跑垒方向的简化示意图。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b55b2a"/>
    </marker>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8d6b3c" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="820" height="600" fill="#fbfaf6"/>
  <text x="410" y="52" text-anchor="middle" fill="#333333" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="30" font-weight="700">跑垒顺序示意</text>
  <path d="M410 470 L560 320 L410 170 L260 320 Z" fill="#f1dfb8" stroke="#c79d5c" stroke-width="7" filter="url(#soft)"/>
  <line x1="410" y1="470" x2="560" y2="320" stroke="#b55b2a" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="560" y1="320" x2="410" y2="170" stroke="#b55b2a" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="410" y1="170" x2="260" y2="320" stroke="#b55b2a" stroke-width="8" marker-end="url(#arrow)"/>
  <line x1="260" y1="320" x2="410" y2="470" stroke="#b55b2a" stroke-width="8" marker-end="url(#arrow)"/>
  <circle cx="410" cy="470" r="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="3"/>
  <circle cx="560" cy="320" r="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="3"/>
  <circle cx="410" cy="170" r="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="3"/>
  <circle cx="260" cy="320" r="18" fill="#ffffff" stroke="#d9d9d9" stroke-width="3"/>
  <text x="410" y="515" text-anchor="middle" fill="#5a4528" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="24" font-weight="700">本垒</text>
  <text x="590" y="326" fill="#5a4528" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="24" font-weight="700">一垒</text>
  <text x="410" y="138" text-anchor="middle" fill="#5a4528" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="24" font-weight="700">二垒</text>
  <text x="182" y="326" fill="#5a4528" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="24" font-weight="700">三垒</text>
  <text x="410" y="560" text-anchor="middle" fill="#7c5b31" font-family="Arial, 'Noto Sans SC', sans-serif" font-size="18">跑垒方向：本垒 → 一垒 → 二垒 → 三垒 → 本垒</text>
</svg>